[tool.poetry]
name = "quant-zero"
version = "0.1.0"
description = "A moving average crossover backtest"
authors = ["David"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
yfinance = "^1.4.0"
pandas = "^3.0.0"
numpy = "^2.4.6"
matplotlib = "^3.10.9"
psycopg2-binary = "^2.9.12"
python-dotenv = "^1.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"